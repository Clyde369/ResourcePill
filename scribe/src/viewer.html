<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResourcePill · Recordings</title>
<style>
  :root {
    --bg: #0d1017; --panel: rgba(255,255,255,.045); --panel2: rgba(255,255,255,.07); --line: rgba(255,255,255,.08);
    --fg: #eef2ff; --dim: rgba(238,242,255,.58); --faint: rgba(238,242,255,.36);
    --accent: #5ac8fa; --accent2: #bf5af2; --hot: #ff453a;
    --s1: #5ac8fa; --s2: #bf5af2; --s3: #30d158; --s4: #ff9f0a; --s5: #64d2ff; --s6: #ff6b9a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 80% -10%, #1b2440 0%, var(--bg) 55%); color: var(--fg);
    font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  ::selection { background: rgba(90,200,250,.35); }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: rgba(0,0,0,.18); }
  .brand { padding: 18px 18px 10px; font-weight: 600; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 0 18px rgba(90,200,250,.35); }
  .search { margin: 4px 14px 10px; }
  input[type=search] { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); outline: none; font: inherit; }
  input[type=search]:focus { border-color: rgba(90,200,250,.5); }
  .list { overflow: auto; padding: 4px 8px 16px; flex: 1; }
  .item { padding: 11px 12px; border-radius: 12px; cursor: pointer; margin-bottom: 4px; transition: background .15s; }
  .item:hover { background: var(--panel); }
  .item.on { background: var(--panel2); box-shadow: inset 0 0 0 1px rgba(90,200,250,.25); }
  .item .t { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .m { color: var(--dim); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; }
  .empty { color: var(--faint); padding: 30px 18px; text-align: center; }
  main { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 22px 28px 12px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); display: inline-flex; gap: 6px; align-items: center; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tools { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button, .btn { font: inherit; font-size: 12.5px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
  button:hover { background: var(--panel2); border-color: rgba(255,255,255,.16); }
  .scroll { overflow: auto; padding: 4px 28px 120px; flex: 1; scroll-behavior: smooth; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; margin: 6px 0 18px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
  .card h2:first-child { margin-top: 0; }
  .card ul { margin: 4px 0; padding-left: 20px; } .card p { margin: 4px 0 8px; }
  .collapse { cursor: pointer; user-select: none; color: var(--dim); font-size: 12px; float: right; }
  .line { display: grid; grid-template-columns: 58px 1fr; gap: 12px; padding: 8px 12px; border-radius: 12px; cursor: pointer; transition: background .15s; }
  .line:hover { background: var(--panel); }
  .line.now { background: linear-gradient(90deg, rgba(90,200,250,.14), rgba(90,200,250,.04)); box-shadow: inset 3px 0 0 var(--accent); }
  .time { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12.5px; padding-top: 1px; }
  .who { font-weight: 600; font-size: 12.5px; margin-right: 6px; }
  mark { background: rgba(255,214,10,.35); color: inherit; border-radius: 3px; }
  .player { position: fixed; left: 300px; right: 0; bottom: 0; padding: 14px 28px 18px; background: linear-gradient(0deg, rgba(10,13,20,.97) 60%, rgba(10,13,20,0)); }
  .bar { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; backdrop-filter: blur(14px); }
  .play { width: 40px; height: 40px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #071018; font-size: 15px; padding: 0; box-shadow: 0 4px 18px rgba(90,200,250,.3); }
  .play:hover { filter: brightness(1.08); background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .clock { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12.5px; min-width: 96px; text-align: center; }
  .noaudio { color: var(--faint); font-size: 12.5px; }
  .toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: rgba(30,36,52,.95); border: 1px solid var(--line); padding: 8px 14px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="dot"></span>Recordings</div>
    <div class="search"><input id="q" type="search" placeholder="Search recordings"></div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <header id="head"></header>
    <div class="scroll" id="scroll"></div>
  </main>
</div>
<div class="player" id="player"></div>
<div class="toast" id="toast"></div>
<script src="recordings.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const enc = id => id.split("/").map(encodeURIComponent).join("/");
// recordings.js lists the folders; each folder's rec.js hands its data to RP_ADD as it loads
const folders = (window.RP_INDEX || []).slice().sort().reverse();
const want = new URLSearchParams(location.search).get("rec");
const index = [];
const palette = ["--s1","--s2","--s3","--s4","--s5","--s6"];
let rec = null, audio = null, lineEls = [], follow = true, filter = "";

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1400); }

function renderList() {
  const q = $("#q").value.toLowerCase();
  const items = index.filter(r => !q || (r.title + " " + r.date + " " + (r.text || "")).toLowerCase().includes(q));
  $("#list").innerHTML = items.length ? items.map(r => `
    <div class="item ${rec && rec.id === r.id ? "on" : ""}" data-id="${esc(r.id)}">
      <div class="t">${esc(r.title || "Recording")}</div>
      <div class="m"><span>${esc(r.date)}</span><span>${fmt(r.duration)}</span><span>${r.speakers.length} ${r.speakers.length === 1 ? "voice" : "voices"}</span></div>
    </div>`).join("") : `<div class="empty">${folders.length ? (index.length ? "No matches" : "Loading…") : "No recordings yet.<br>Press record on the pill to make one."}</div>`;
  document.querySelectorAll(".item").forEach(el => el.onclick = () => open(el.dataset.id));
}

function md(text) {
  const out = []; let list = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  for (const raw of String(text || "").split("\n")) {
    const l = raw.trim();
    if (/^#\s/.test(l)) continue;
    if (/^#{2,}\s/.test(l)) { if (list) { out.push("</ul>"); list = false; } out.push("<h2>" + inline(l.replace(/^#+\s/, "")) + "</h2>"); }
    else if (/^[-*•]\s+/.test(l)) { if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + inline(l.replace(/^[-*•]\s+/, "")) + "</li>"); }
    else if (l) { if (list) { out.push("</ul>"); list = false; } out.push("<p>" + inline(l) + "</p>"); }
  }
  if (list) out.push("</ul>");
  return out.join("");
}

function colorOf(who) { if (who === "You") return "var(--s1)"; const i = rec.speakers.indexOf(who); return `var(${palette[(i + 1) % palette.length]})`; }

function renderRec() {
  const r = rec;
  $("#head").innerHTML = `
    <h1>${esc(r.title || "Recording")}</h1>
    <div class="sub"><span>${esc(r.date)}</span><span>${fmt(r.duration)}</span><span>${esc(r.model)}</span></div>
    <div class="chips">${r.speakers.map(w => `<span class="chip"><i style="background:${colorOf(w)}"></i>${esc(w)}</span>`).join("")}</div>
    <div class="tools">
      <input id="tq" type="search" placeholder="Search this transcript" style="max-width:260px">
      <button id="cpT">Copy transcript</button>${r.summary ? '<button id="cpS">Copy summary</button>' : ""}
      <button id="fol">${follow ? "Following audio ✓" : "Follow audio"}</button>
    </div>`;
  const sum = r.summary ? `<div class="card"><span class="collapse" id="tog">hide</span><div id="sumbody">${md(r.summary)}</div></div>` : "";
  $("#scroll").innerHTML = sum + `<div id="lines"></div>`;
  renderLines();
  $("#tq").oninput = e => { filter = e.target.value.toLowerCase(); renderLines(); };
  $("#cpT").onclick = () => { navigator.clipboard.writeText(r.lines.map(l => `[${fmt(l.t)}] ${l.who}: ${l.text}`).join("\n")); toast("Transcript copied"); };
  if (r.summary) $("#cpS").onclick = () => { navigator.clipboard.writeText(r.summary); toast("Summary copied"); };
  $("#fol").onclick = () => { follow = !follow; $("#fol").textContent = follow ? "Following audio ✓" : "Follow audio"; };
  const tog = $("#tog"); if (tog) tog.onclick = () => { const b = $("#sumbody"); const h = b.style.display === "none"; b.style.display = h ? "" : "none"; tog.textContent = h ? "hide" : "show summary"; };
  renderPlayer();
}

function renderLines() {
  const hl = s => filter ? esc(s).replace(new RegExp(filter.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`) : esc(s);
  const rows = rec.lines.map((l, i) => ({ l, i })).filter(({ l }) => !filter || (l.who + " " + l.text).toLowerCase().includes(filter));
  $("#lines").innerHTML = rows.length ? rows.map(({ l, i }) => `
    <div class="line" data-i="${i}"><div class="time">${fmt(l.t)}</div>
    <div><span class="who" style="color:${colorOf(l.who)}">${esc(l.who)}</span>${hl(l.text)}</div></div>`).join("")
    : `<div class="empty">${rec.lines.length ? "No matching lines" : "Nothing was said in this recording."}</div>`;
  lineEls = [...document.querySelectorAll(".line")];
  lineEls.forEach(el => el.onclick = () => seek(rec.lines[+el.dataset.i].t));
}

function renderPlayer() {
  if (audio) { audio.pause(); audio = null; }
  if (!rec.audio) { $("#player").innerHTML = `<div class="bar"><span class="noaudio">The audio of this recording wasn't kept · turn on “Keep the audio” in the pill's Transcription menu</span></div>`; return; }
  $("#player").innerHTML = `<div class="bar">
      <button class="btn" id="back" title="Back 10 s">−10</button>
      <button class="play" id="pp" title="Play / pause (space)">▶</button>
      <button class="btn" id="fwd" title="Forward 10 s">+10</button>
      <span class="clock" id="clk">0:00 / ${fmt(rec.duration)}</span>
      <input type="range" id="pos" min="0" max="1000" value="0">
      <button class="btn" id="spd" title="Playback speed">1×</button>
    </div>`;
  audio = new Audio(enc(rec.id) + "/" + encodeURIComponent(rec.audio));
  const speeds = [1, 1.25, 1.5, 2]; let si = 0;
  $("#pp").onclick = () => audio.paused ? audio.play() : audio.pause();
  $("#back").onclick = () => seek(audio.currentTime - 10, true);
  $("#fwd").onclick = () => seek(audio.currentTime + 10, true);
  $("#spd").onclick = () => { si = (si + 1) % speeds.length; audio.playbackRate = speeds[si]; $("#spd").textContent = speeds[si] + "×"; };
  $("#pos").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 1000 * audio.duration; };
  audio.onplay = () => $("#pp").textContent = "❚❚";
  audio.onpause = () => $("#pp").textContent = "▶";
  audio.ontimeupdate = tick;
}

let current = -1;
function tick() {
  const t = audio.currentTime, d = audio.duration || rec.duration || 1;
  $("#clk").textContent = `${fmt(t)} / ${fmt(d)}`;
  if (document.activeElement !== $("#pos")) $("#pos").value = t / d * 1000;
  let i = -1; for (let k = 0; k < rec.lines.length; k++) { if (rec.lines[k].t <= t + 0.15) i = k; else break; }
  if (i !== current) {
    current = i;
    lineEls.forEach(el => el.classList.toggle("now", +el.dataset.i === i));
    const el = lineEls.find(e => +e.dataset.i === i);
    if (el && follow) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}

function seek(t, keepState) { if (!audio) return; audio.currentTime = Math.max(0, t); if (!keepState) audio.play(); tick(); }

function open(id) {
  const r = index.find(x => x.id === id);
  if (!r) return;
  rec = r; current = -1; renderRec(); renderList();
  history.replaceState(null, "", "?rec=" + encodeURIComponent(id));
}

window.RP_ADD = (script, data) => {
  data.id = script.dataset.id;
  data.speakers = data.speakers || [];
  data.lines = data.lines || [];
  data.text = data.lines.map(l => l.text).join(" ");
  index.push(data);
  index.sort((a, b) => b.id.localeCompare(a.id));
  renderList();
  if (!rec && data.id === (want && folders.includes(want) ? want : folders[0])) open(data.id);
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || !audio) return;
  if (e.code === "Space") { e.preventDefault(); audio.paused ? audio.play() : audio.pause(); }
  if (e.code === "ArrowLeft") seek(audio.currentTime - 5, true);
  if (e.code === "ArrowRight") seek(audio.currentTime + 5, true);
});
$("#q").oninput = renderList;
for (const f of folders) {
  const s = document.createElement("script");
  s.dataset.id = f;
  s.src = enc(f) + "/rec.js";
  document.body.appendChild(s);
}
renderList();
if (!folders.length) { $("#head").innerHTML = "<h1>No recordings yet</h1><div class='sub'>Press the record button on the pill, then stop: your transcript, summary and audio will appear here.</div>"; }
</script>
</body>
</html>
