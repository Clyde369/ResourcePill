[package]
name = "resource-pill"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Tiny always-on-top resource monitor for Windows"
repository = "https://github.com/Clyde369/ResourcePill"

[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Globalization", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # sampler recovers from panics instead of killing the app
strip = true

[build-dependencies]
cc = "1.11.1"
