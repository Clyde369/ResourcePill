[package]
name = "resource-pill"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Tiny always-on-top resource monitor for Windows"
repository = "https://github.com/Clyde369/ResourcePill"

[dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization","Win32_Globalization", "Win32_System_Ioctl", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dxgi", "Win32_System_Com", "Win32_Media_Audio", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Media_Control", "Foundation", "Storage_Streams", "Win32_Graphics_Imaging", "Win32_Media_Speech", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_ProcessStatus", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # sampler recovers from panics instead of killing the app
strip = true

[build-dependencies]
cc = "1.11.1"

[workspace]
members = ["scribe"]
